seed: 1337

data:
  sources:
    - name: mixed
      path: /home/asrivastava/VJEPA2_BTP/datasets/mixed250_s69_n250
      take: all
    - name: side
      path: /home/asrivastava/VJEPA2_BTP/datasets/side50_s69_n50
      take: all
    - name: pack
      path: /home/asrivastava/VJEPA2_BTP/datasets/pack_20260911_043022_s67_n1000
      take: 500
  cache_dir: /raid/asrivastava/VJEPA2_BTP/model_trial_2/cache
  split_file: /raid/asrivastava/VJEPA2_BTP/model_trial_2/cache/split.json
  catalog_file: /raid/asrivastava/VJEPA2_BTP/model_trial_2/cache/catalog.json
  n_frames: 150
  fps: 30
  val_fraction: 0.2
  test_fraction: 0.0
  target_grid: 5
  heatmap_upsample: nearest

# Giant V-JEPA 2 teacher. If 8 GB cannot load it, switch hf_model_id to
# facebook/vjepa2-vitl-fpc64-256 (still a real V-JEPA 2 encoder, 300M).
teacher:
  hf_model_id: facebook/vjepa2-vitg-fpc64-256
  hf_cache_dir: /raid/asrivastava/VJEPA2_BTP/model_trial_2/hf_cache
  img_size: 256
  clip_frames: 8
  clip_stride: 2
  z_channels: 32
  pool_hidden: 128
  torch_dtype: float16
  # Original recipe used 1 for an 8 GB 4060. A100 40 GB can take 8.
  micro_batch: 8
  device: auto
  # Phase 1: freeze ViT, train adapter + decoder + predictor.
  adapter_epochs: 6
  # Phase 2: LoRA on last encoder blocks (collision-specific latent).
  lora_epochs: 14
  lora_rank: 16
  lora_alpha: 16.0
  lora_last_blocks: 6
  adapter_lr: 0.001
  lora_lr: 0.0002
  sample_stride: 4

student:
  img_size: 160
  cnn_width: 32
  feature_grid: 5
  z_channels: 32
  use_loom: true
  copy_residual: true
  frame_offsets: [-20, -15, -10, -5, 0]

horizon:
  tau_seconds: 1.0
  tau_frames: 30
  mid_tau_frames: 15

heatmap:
  recall_threshold: 0.5

jepa:
  lambda: 0.25
  now_weight: 0.35
  mid_weight: 0.20
  dir_weight: 0.30
  fp_weight: 0.45
  fp_safe_threshold: 0.25
  fp_center_mult: 3.5
  fp_center_cols: [1, 2, 3]
  delta_weight: 0.50

train:
  device: auto
  batch_size: 32
  num_workers: 2
  prefetch_factor: 4
  student_epochs: 40
  lr: 0.001
  weight_decay: 0.0001
  cosine: true
  amp: true
  focal_weight: 1.0
  focal_gamma: 2.0
  change_weight: 2.5
  fn_weight: 0.6
  hot_mult: 1.5
  rare_mult: 2.0
  change_mult: 3.0
  quiet_mult: 4.0
  quiet_peak: 0.25
  quiet_ep_mult: 2.5
  center_cool_mult: 5.5
  center_cool_peak: 0.28
  center_cool_mode: inner
  spatial_loss: true
  spatial_center: 2.2
  spatial_ring: 1.5
  spatial_edge: 1.0
  spatial_corner: 0.65
  grad_clip: 1.0

warning:
  row_weights: [0.5, 0.65, 0.8, 1.0, 1.0]
  left_cols: [0, 1]
  center_cols: [2]
  right_cols: [3, 4]
  caution_threshold: 0.42
  stop_threshold: 0.70
  confirm_frames: 3
  release_frames: 5

selection:
  nuisance_weight: 0.5
  miss_weight: 0.5
  max_nuisance: 0.20
  max_miss: 0.25
  use_latch: true

paths:
  ckpt_dir: /raid/asrivastava/VJEPA2_BTP/model_trial_2/checkpoints
  export_dir: /raid/asrivastava/VJEPA2_BTP/model_trial_2/export
  log_dir: /raid/asrivastava/VJEPA2_BTP/model_trial_2/logs
  overlay_dir: /raid/asrivastava/VJEPA2_BTP/model_trial_2/overlays
