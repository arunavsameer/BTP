# Collision-JEPA default configuration.
# All paths are resolved relative to the project root (folder containing this repo)
# unless given as absolute paths.

seed: 1337

data:
  # Source dataset zip and where it is unpacked.
  zip_path: "e:/btp/datasets.zip"
  raw_dir: "e:/btp/collision_jepa/data_raw"        # unzipped episodes live here
  cache_dir: "e:/btp/collision_jepa/cache"          # cached frames / heatmaps / Z
  # Prefer native 5x5 packs (80%) so bilinear-smeared 3x3 maps do not dominate.
  k5_subsets: ["pack_20260911_043022_s67_n1000"]
  k5_fraction: 0.8
  target_episodes: 500
  # Space-saving knobs (see plan). Overlays are visualization-only.
  skip_overlays: true          # do not extract spatial_overlay.mp4
  cache_all_frames: true       # cache all 150 frames per episode (else only sampled)

  grid: 5                      # heatmap is grid x grid
  fps: 30
  n_frames: 150

  # Episode-level stratified split.
  val_count: 50
  test_count: 50
  val_fraction: 0.2
  split_file: "e:/btp/collision_jepa/cache/split.json"

heatmap:
  # Threshold semantics for high-threat weighting and metrics.
  medium_threshold: 0.45
  high_threshold: 0.75
  # A cell counts as "high threat" (for recall metrics) above this.
  recall_threshold: 0.5

student:
  img_size: 128                # student input HxW
  frame_offsets: [-10, -5, 0]  # relative to current time t (30 fps -> ~167 ms spacing)
  z_channels: 16               # Z is grid x grid x z_channels
  occ_channels: 4              # last channels of Z are occupancy (threat vs clutter)
  cnn_width: 32                # base channel width of the depthwise-separable CNN
  feature_grid: 5              # spatial size Z is pooled to (matches grid)

teacher:
  # V-JEPA-2 via HuggingFace. Kept frozen, only run offline for caching.
  hf_model_id: "facebook/vjepa2-vitl-fpc64-256"
  clip_frames: 8
  clip_stride: 2
  img_size: 256                # V-JEPA-2 vitl checkpoints expect 256
  z_channels: 16
  device: "auto"               # auto -> cuda if available else cpu
  fp16: true                   # half precision for the frozen backbone (fits 4 GB)

horizon:
  tau_seconds: 1.0             # main prediction horizon
  tau_frames: 30

train:
  device: "auto"
  batch_size: 32
  stage0_epochs: 40
  teacher_epochs: 40
  student_epochs: 60
  lr: 0.001
  weight_decay: 0.0001
  num_workers: 4               # overlap data loading with GPU compute
  # Student/teacher heatmap: ignore leaves (H≈0), punish false alarms, occupancy BCE.
  focal_weight: 4.0            # α in w = bg_weight + α H^gamma
  focal_gamma: 2.0
  bg_weight: 0.05              # empty/leaf cells
  ignore_below: 0.15           # both pred and true below this → no regression
  fa_weight: 1.0               # false-alarm (pred CAUTION+ on safe cell)
  fa_pred_thr: 0.45
  fa_true_thr: 0.2
  occupancy_threshold: 0.3
  occupancy_pos_weight: 4.0
  occupancy_weight: 0.5        # teacher: occupancy BCE vs heatmap loss
  occupancy_frac: 0.20         # student: occupancy vs L(H+) after balancing
  rare_oversample: 3           # teacher epoch: extra copies of NEAR_MISS/CRITICAL
  k5_oversample: 2             # teacher epoch: extra copies of native k=5
  change_weight: 2.0           # extra weight on cells where |H+ - H_t| is large
  now_heatmap_weight: 0.5      # L(H_t) coefficient (same units as L(H+); not balanced)
  smooth_l1_beta: 0.1
  readout_frac: 0.40           # target L_readout / L(H+)
  stop_frac: 0.15              # target L_STOP / L(H+)
  stop_fn_weight: 2.5          # missed STOP costs more than a false STOP
  stop_temperature: 0.05
  stop_focal_gamma: 2.0
  jepa_lambda: 1.0             # >0 enables JEPA; scale is jepa_frac of L(H+), not a raw multiplier
  jepa_frac: 0.10              # target λ_j L_JEPA / L(H+) after balancing
  latent_heatmap_frac: 0.30    # decoder(Zhat+) vs H+; keeps the predictor tied to the heatmap
  balance_max_boost: 5.0       # do not amplify a tiny aux term more than this

warning:
  # Column groups for direction readout.
  left_cols: [0, 1]
  center_cols: [2]
  right_cols: [3, 4]
  # Row weights (far -> near); near rows matter more.
  row_weights: [0.4, 0.6, 0.8, 1.0, 1.0]
  # Severity thresholds on the near-weighted direction score (starting points).
  caution_threshold: 0.45
  stop_threshold: 0.75
  # Hysteresis (HitLatch): consecutive frames required to switch state.
  confirm_frames: 3
  release_frames: 5

paths:
  ckpt_dir: "e:/btp/collision_jepa/checkpoints"
  log_dir: "e:/btp/collision_jepa/logs"
  export_dir: "e:/btp/collision_jepa/export"
