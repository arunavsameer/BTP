seed: 1337

data:
  sources:
    - name: mixed
      path: /storage/BTP/blender_sim/datasets/mixed250_s67_n250
      take: all
    - name: side
      path: /storage/BTP/blender_sim/datasets/side40_s11_n50
      take: all
    - name: pack
      path: /storage/BTP/blender_sim/datasets/pack_20260911_043022_s67_n1000
      take: 300
  cache_dir: /storage/BTP/model_trial_1/cache
  split_file: /storage/BTP/model_trial_1/cache/split.json
  catalog_file: /storage/BTP/model_trial_1/cache/catalog.json
  n_frames: 150
  fps: 30
  val_fraction: 0.2
  # Test is carved from the original val pool (scripts/05_make_test_split.py) so
  # train stays frozen for already-running experiments.
  test_fraction: 0.0
  cache_all_frames: true
  target_grid: 5
  heatmap_upsample: nearest

student:
  img_size: 160
  cnn_width: 32
  feature_grid: 5
  z_channels: 24
  use_loom: true
  frame_offsets: [-20, -10, -5, 0]

horizon:
  tau_seconds: 1.0
  tau_frames: 30
  mid_tau_frames: 15

heatmap:
  recall_threshold: 0.5

shuffle:
  # Fraction of training samples that get a non-identity 5x5 permutation.
  # Identity samples keep the real layout so deployment (no shuffle) is in-distribution.
  prob: 0.80
  prob_start: 0.40
  curriculum: true
  # 180° rotate a moved cell when its destination is opposite the source
  # relative to image centre (preserves looming / "coming toward me").
  rotate_opposite: true

jepa:
  # EMA of the student encoder is the target encoder (V-JEPA-style).
  ema_momentum: 0.996
  lambda: 0.12
  now_weight: 0.20
  mid_weight: 0.35
  dir_weight: 0.45
  fp_weight: 0.12
  fp_safe_threshold: 0.20

train:
  device: auto
  batch_size: 32
  num_workers: 2
  prefetch_factor: 4
  lr: 0.001
  weight_decay: 0.0001
  epochs: 40
  cosine: true
  amp: true
  focal_weight: 1.25
  focal_gamma: 2.0
  change_weight: 2.5
  fn_weight: 2.0
  hot_mult: 5.0
  rare_mult: 2.5
  change_mult: 3.0
  grad_clip: 1.0

warning:
  row_weights: [0.5, 0.65, 0.8, 1.0, 1.0]
  left_cols: [0, 1]
  center_cols: [2]
  right_cols: [3, 4]
  caution_threshold: 0.42
  stop_threshold: 0.70
  confirm_frames: 3
  release_frames: 5

paths:
  ckpt_dir: /storage/BTP/model_trial_1/checkpoints
  export_dir: /storage/BTP/model_trial_1/export
  log_dir: /storage/BTP/model_trial_1/logs
  overlay_dir: /storage/BTP/model_trial_1/overlays
