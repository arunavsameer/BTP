seed: 1337

data:
  sources:
    # 600 episodes: pack 300 + mixed_s69 250 + side_s69 50.
    - name: mixed
      path: /storage/BTP/blender_sim/datasets/mixed250_s69_n250
      take: all
    - name: side
      path: /storage/BTP/blender_sim/datasets/side50_s69_n50
      take: all
    - name: pack
      path: /storage/BTP/blender_sim/datasets/pack_20260911_043022_s67_n1000
      take: 300
  cache_dir: /storage/BTP/model_trial_1/cache_grid5
  split_file: /storage/BTP/model_trial_1/cache_grid5/split.json
  catalog_file: /storage/BTP/model_trial_1/cache_grid5/catalog.json
  n_frames: 150
  fps: 30
  val_fraction: 0.2
  test_fraction: 0.0
  cache_all_frames: true
  target_grid: 5
  heatmap_upsample: nearest

student:
  img_size: 160
  cnn_width: 32
  feature_grid: 5
  z_channels: 24
  use_loom: true
  copy_residual: true
  # Even 5-frame steps (30 fps): 667ms of motion, linear in time.
  frame_offsets: [-20, -15, -10, -5, 0]

horizon:
  tau_seconds: 1.0
  tau_frames: 30
  mid_tau_frames: 15

heatmap:
  recall_threshold: 0.5

shuffle:
  # Keep a little left/right invariance; 0.20 was still noisy on empty road.
  prob: 0.15
  prob_start: 0.15
  curriculum: false
  rotate_opposite: true

jepa:
  ema_momentum: 0.996
  lambda: 0.12
  now_weight: 0.35
  mid_weight: 0.25
  dir_weight: 0.30
  fp_weight: 0.45
  fp_safe_threshold: 0.25
  fp_center_mult: 3.5
  fp_center_cols: [1, 2, 3]
  delta_weight: 0.50

train:
  device: auto
  batch_size: 32
  num_workers: 2
  prefetch_factor: 4
  lr: 0.001
  weight_decay: 0.0001
  epochs: 40
  cosine: true
  amp: true
  focal_weight: 1.0
  focal_gamma: 2.0
  change_weight: 2.5
  fn_weight: 0.6
  hot_mult: 1.5
  rare_mult: 2.0
  change_mult: 3.0
  quiet_mult: 4.0
  quiet_peak: 0.25
  quiet_ep_mult: 2.5
  center_cool_mult: 5.5
  center_cool_peak: 0.28
  center_cool_mode: inner
  spatial_loss: true
  spatial_center: 2.2
  spatial_ring: 1.5
  spatial_edge: 1.0
  spatial_corner: 0.65
  grad_clip: 1.0

warning:
  row_weights: [0.5, 0.65, 0.8, 1.0, 1.0]
  left_cols: [0, 1]
  center_cols: [2]
  right_cols: [3, 4]
  caution_threshold: 0.42
  stop_threshold: 0.70
  confirm_frames: 3
  release_frames: 5

selection:
  nuisance_weight: 0.5
  miss_weight: 0.5
  max_nuisance: 0.20
  max_miss: 0.25
  use_latch: true

paths:
  ckpt_dir: /storage/BTP/model_trial_1/checkpoints_grid5
  export_dir: /storage/BTP/model_trial_1/export_grid5
  log_dir: /storage/BTP/model_trial_1/logs_grid5
  overlay_dir: /storage/BTP/model_trial_1/overlays_grid5
